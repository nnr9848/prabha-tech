services:
  # =========================================================
  # Database: PostgreSQL 16
  # =========================================================
  db:
    image: postgres:16-alpine
    container_name: prabhatech_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prabhatech_db}
      POSTGRES_USER: ${POSTGRES_USER:-prabhatech_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prabhatech_pass}
    volumes:
      - prabhatech_pgdata:/var/lib/postgresql/data
    networks:
      - prabhatech_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prabhatech_user} -d ${POSTGRES_DB:-prabhatech_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  # =========================================================
  # Backend API: Spring Boot 3 REST API (Optimized JVM)
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prabhatech_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-prabhatech_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-prabhatech_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-prabhatech_pass}
      APP_JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+ExitOnOutOfMemoryError"
    networks:
      - prabhatech_net
    deploy:
      resources:
        limits:
          memory: 512M

  # =========================================================
  # Frontend: React Vite SPA + Nginx Web Server (Port 3005)
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prabhatech_frontend
    restart: always
    ports:
      - "${APP_PORT:-3005}:80"
    depends_on:
      - backend
    networks:
      - prabhatech_net
    deploy:
      resources:
        limits:
          memory: 128M

# =========================================================
# Volumes & Networks
# =========================================================
volumes:
  prabhatech_pgdata:

networks:
  prabhatech_net:
    driver: bridge
